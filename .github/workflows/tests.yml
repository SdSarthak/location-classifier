name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        run: pytest

      - name: Smoke-test the CLI end to end
        env:
          MPLBACKEND: Agg
        run: |
          python -m location_classifier make-data --sites zones --samples-per-class 40
          python -m location_classifier train --n-anchors 6 --cv-folds 3 --plots
          python -m location_classifier evaluate --json
          python -m location_classifier predict --lat 19.076 --lon 72.877
          python -m location_classifier cluster --n-clusters 8
